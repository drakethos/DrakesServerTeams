name: Build

on:
  push:
    branches: ["**"]
  pull_request:

# Build check only. Releasing (Thunderstore / Hexium) is added later, copied from DrakesRenameIt's release.yml.
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore NuGet packages
        run: nuget restore DrakesServerTeams.csproj -PackagesDirectory packages

      - name: Fetch DrakeModsLibs reference DLL
        run: |
          LIBS_DEP=$(grep -oE 'DrakeMods-DrakeModsLibs-[0-9]+\.[0-9]+\.[0-9]+' mod.package.props | head -1)
          LIBS_VER="${LIBS_DEP#DrakeMods-DrakeModsLibs-}"
          curl -fsSL "https://thunderstore.io/package/download/DrakeMods/DrakeModsLibs/${LIBS_VER}/" -o /tmp/drakemodslibs.zip
          mkdir -p ci_libs /tmp/drakemodslibs
          unzip -qo /tmp/drakemodslibs.zip -d /tmp/drakemodslibs
          cp "$(find /tmp/drakemodslibs -name 'DrakeModsLibs.dll' | head -1)" ci_libs/DrakeModsLibs.dll
          echo "WORKSHOP_LIBS_DLL=$(pwd)/ci_libs/DrakeModsLibs.dll" >> "$GITHUB_ENV"

      - name: Stage game DLLs from Pfhoenix package
        run: |
          PFHOENIX_LIB=$(ls -d packages/Pfhoenix.Valheim.ModProjectReferences.*/lib/net46 | head -1)
          MANAGED="ci_valheim/valheim_Data/Managed"
          PUBLICIZED="$MANAGED/publicized_assemblies"
          BEPINEX="ci_valheim/BepInEx/core"
          mkdir -p "$MANAGED" "$PUBLICIZED" "$BEPINEX"
          cp "$PFHOENIX_LIB/"*.dll "$MANAGED/"
          cp "$PFHOENIX_LIB/assembly_valheim.dll" "$PUBLICIZED/assembly_valheim_publicized.dll"
          cp "$PFHOENIX_LIB/assembly_utils.dll"   "$PUBLICIZED/assembly_utils_publicized.dll"
          cp "$PFHOENIX_LIB/gui_framework.dll"    "$PUBLICIZED/gui_framework_publicized.dll"
          cp "$PFHOENIX_LIB/0Harmony.dll" "$BEPINEX/"
          cp "$PFHOENIX_LIB/bepinex.dll"  "$BEPINEX/BepInEx.dll"
          echo "VALHEIM_INSTALL=$(pwd)/ci_valheim" >> "$GITHUB_ENV"

      - name: Build
        env:
          CI_NET48_FWPATH: ${{ github.workspace }}/packages/Microsoft.NETFramework.ReferenceAssemblies.net48.1.0.3/build
          CI_SKIP_POST_BUILD: "true"
        run: |
          CI_ROOT="$(pwd)/ci_valheim"
          MANAGED="$CI_ROOT/valheim_Data/Managed"
          dotnet msbuild DrakesServerTeams.csproj \
            /p:Configuration=Release \
            /p:TargetFrameworkVersion=v4.8 \
            /p:BepInExPath="$CI_ROOT/BepInEx" \
            /p:CorlibPath="$MANAGED" \
            /p:PublicizedAssembliesPath="$MANAGED/publicized_assemblies" \
            /p:WorkshopLibsDll="${WORKSHOP_LIBS_DLL}" \
            /t:Build \
            /v:minimal
